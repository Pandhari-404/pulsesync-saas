name: PulseSync CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ============================================================================
  # Job 1: Backend Lint, Test & Verification
  # ============================================================================
  test-backend:
    name: Backend Lint, Test & Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    env:
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "pulsesync_ci_super_secret_jwt_key_32_chars_min"
      JWT_EXPIRES_IN: "7d"
      PORT: "5000"
      NODE_ENV: "test"

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: npm ci

      - name: Generate Prisma Client & Sync DB
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss
          npm run prisma:seed

      - name: Run Backend Integration & Unit Tests
        run: npm test

      - name: Verify Server Production TypeScript Build
        run: npm run build

  # ============================================================================
  # Job 2: Frontend SPA Type Check & Production Bundle Build
  # ============================================================================
  test-frontend:
    name: Frontend SPA Build & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci

      - name: Build Optimized Production Bundle
        run: npm run build

  # ============================================================================
  # Job 3: Containerization Smoke Test
  # ============================================================================
  docker-smoke-test:
    name: Docker Multi-Stage Build Smoke Test
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: pulsesync-backend:test

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: pulsesync-frontend:test
