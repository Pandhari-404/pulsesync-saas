# Render Cloud Infrastructure as Code Blueprint
services:
  - type: web
    name: pulsesync-backend
    env: node
    plan: starter
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run prisma:seed && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"

  - type: web
    name: pulsesync-frontend
    env: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
