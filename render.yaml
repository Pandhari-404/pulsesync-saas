# Render Cloud Infrastructure Blueprint
services:
  # ----------------------------------------------------------------------------
  # Backend Web Service (Node.js REST API)
  # ----------------------------------------------------------------------------
  - type: web
    name: pulsesync-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run prisma:seed && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: JWT_SECRET
        value: "pulsesync_production_jwt_secret_key_32_chars_min"
      - key: CORS_ORIGIN
        value: "*"

  # ----------------------------------------------------------------------------
  # Frontend Static Site (React + Vite SPA)
  # ----------------------------------------------------------------------------
  - type: static
    name: pulsesync-frontend
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
